services:

  # ────────────────────────────────────────────────────────────
  # Downloader: stahuje korpusy z HuggingFace a ukládá do SQLite
  # Spouští se jednorázově (nebo cronerem), pak se ukončí.
  # ────────────────────────────────────────────────────────────
  downloader:
    build:
      context: ./downloader
    container_name: corpus_downloader
    volumes:
      - corpus_data:/data          # sdílený volume s DB
    environment:
      DB_PATH: /data/corpora.db
    # Výchozí: stáhne jen nové korpusy.
    # Přepiš command pro jiné chování:
    #   docker compose run --rm downloader python main.py --all
    #   docker compose run --rm downloader python main.py --corpus tatoeba
    command: ["python", "main.py"]
    restart: "no"                  # jednorázový job, nerestartujem
    networks:
      - corpus_net

  # ────────────────────────────────────────────────────────────
  # API: streamuje věty z SQLite dál (HTTP / SSE)
  # Čte DB read-only – může běžet paralelně s downloaderm.
  # ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
    container_name: corpus_api
    volumes:
      - corpus_data:/data       
    environment:
      DB_PATH: /data/corpora.db
      DEFAULT_PAGE_SIZE: "100"
      MAX_PAGE_SIZE: "1000"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - corpus_net

volumes:
  corpus_data:
    driver: local

networks:
  corpus_net:
    driver: bridge
